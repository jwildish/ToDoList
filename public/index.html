<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Shared Lists</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- User selection screen -->
  <div id="user-select" class="screen">
    <div class="user-select-card">
      <h1>Our Shared Lists</h1>
      <p>Who are you?</p>
      <div class="user-buttons">
        <button onclick="selectUser('User 1')" class="user-btn user1-btn">
          <span class="user-avatar">👤</span>
          User 1
        </button>
        <button onclick="selectUser('User 2')" class="user-btn user2-btn">
          <span class="user-avatar">👤</span>
          User 2
        </button>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="screen" style="display:none">
    <header>
      <h1>Our Shared Lists</h1>
      <div class="header-right">
        <span id="current-user" class="user-badge"></span>
        <button onclick="switchUser()" class="switch-btn" title="Switch user">Switch</button>
      </div>
    </header>

    <!-- Lists sidebar / view -->
    <div class="layout">
      <aside id="sidebar">
        <div class="sidebar-header">
          <h2>Lists</h2>
          <button onclick="showNewListModal()" class="add-list-btn" title="New list">+ New List</button>
        </div>
        <ul id="lists-container"></ul>
      </aside>

      <main id="main">
        <div id="no-list-selected" class="empty-state">
          <p>Select a list from the sidebar or create a new one</p>
        </div>

        <div id="list-view" style="display:none">
          <div class="list-header">
            <h2 id="list-title"></h2>
            <div class="list-actions">
              <button onclick="clearChecked()" class="action-btn" title="Clear checked items">Clear Done</button>
              <button onclick="confirmDeleteList()" class="action-btn danger" title="Delete list">Delete List</button>
            </div>
          </div>

          <form id="add-item-form" onsubmit="addItem(event)">
            <input type="text" id="item-input" placeholder="Add an item..." autocomplete="off" required>
            <button type="submit" class="add-item-btn">Add</button>
          </form>

          <ul id="items-container"></ul>
          <div id="no-items" class="empty-state" style="display:none">
            <p>No items yet. Add one above!</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- New list modal -->
  <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="hideNewListModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Create New List</h3>
      <form onsubmit="createList(event)">
        <input type="text" id="list-name-input" placeholder="List name (e.g. Grocery List)" autocomplete="off" required>
        <div class="modal-actions">
          <button type="button" onclick="hideNewListModal()" class="cancel-btn">Cancel</button>
          <button type="submit" class="confirm-btn">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
